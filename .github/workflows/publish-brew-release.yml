name: Publish Homebrew Release

on:
  workflow_run:
    workflows: ['Create Release Assets']
    types: [completed]
  workflow_dispatch:

jobs:
  publish:
    if:
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Resolve release tag and checksums
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag=$(gh release view --json tagName -q .tagName)
          else
            # head_branch holds the tag name for a workflow_run trigger.
            # Do not use "gh release view" here. It returns the latest
            # release, not the release that triggered this run.
            tag="$HEAD_BRANCH"
          fi
          gh release download "$tag" --pattern SHA256SUMS --dir /tmp --clobber

          macos_arm64=$(awk '/namescan-.*-macos-arm64\.tar\.gz/ { print $1 }' /tmp/SHA256SUMS)
          macos_x86_64=$(awk '/namescan-.*-macos-x86_64\.tar\.gz/ { print $1 }' /tmp/SHA256SUMS)
          linux_arm64=$(awk '/namescan-.*-linux-arm64-gnu\.tar\.gz/ { print $1 }' /tmp/SHA256SUMS)
          linux_x86_64=$(awk '/namescan-.*-linux-x86_64-gnu\.tar\.gz/ { print $1 }' /tmp/SHA256SUMS)

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "macos_arm64=$macos_arm64" >> "$GITHUB_OUTPUT"
          echo "macos_x86_64=$macos_x86_64" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$linux_arm64" >> "$GITHUB_OUTPUT"
          echo "linux_x86_64=$linux_x86_64" >> "$GITHUB_OUTPUT"

      - name: Render formula
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA256_MACOS_ARM64: ${{ steps.release.outputs.macos_arm64 }}
          SHA256_MACOS_X86_64: ${{ steps.release.outputs.macos_x86_64 }}
          SHA256_LINUX_ARM64: ${{ steps.release.outputs.linux_arm64 }}
          SHA256_LINUX_X86_64: ${{ steps.release.outputs.linux_x86_64 }}
        run: |
          sed \
            -e "s|{{TAG}}|$TAG|g" \
            -e "s|{{VERSION}}|$VERSION|g" \
            -e "s|{{SHA256_MACOS_ARM64}}|$SHA256_MACOS_ARM64|g" \
            -e "s|{{SHA256_MACOS_X86_64}}|$SHA256_MACOS_X86_64|g" \
            -e "s|{{SHA256_LINUX_ARM64}}|$SHA256_LINUX_ARM64|g" \
            -e "s|{{SHA256_LINUX_X86_64}}|$SHA256_LINUX_X86_64|g" \
            homebrew/namescan.rb.tmpl > /tmp/namescan.rb

      - name: Checkout homebrew-tools
        uses: actions/checkout@v7
        with:
          repository: zehuac2/homebrew-tools
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tools

      - name: Commit and push formula
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p homebrew-tools/Formula
          cp /tmp/namescan.rb homebrew-tools/Formula/namescan.rb

          cd homebrew-tools
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/namescan.rb

          if git diff --cached --quiet; then
            echo "No changes to formula; skipping commit."
            exit 0
          fi

          git commit -m "namescan ${TAG}"
          git push
