# This workflow will build and test a Rust project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-rust

name: Test

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
    types: [ready_for_review]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: cargo build --verbose
      - name: Lint
        run: cargo clippy --all-targets --verbose -- -D warnings
      - name: Run tests
        run: cargo test --verbose
